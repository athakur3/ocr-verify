[project]
name = "ocr-verify"
version = "0.1.0"
description = "Trust but verify for AI OCR: cross-engine hallucination diff for VLM-OCR pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "athakur3", email = "18129074+athakur3@users.noreply.github.com" }]
keywords = ["ocr", "hallucination", "verification", "tesseract", "vlm", "pdf", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "pymupdf>=1.24",
    "pillow>=10.0",
]

[project.scripts]
ocr-verify = "ocr_verify.cli:main"

[project.urls]
Homepage = "https://github.com/athakur3/ocr-verify"
Issues = "https://github.com/athakur3/ocr-verify/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_verify"]

[dependency-groups]
dev = ["pytest>=8.0", "pyyaml>=6.0"]
