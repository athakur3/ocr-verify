name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Tesseract (the witness)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: uv run pytest -q
      - name: Self-check — verify key study pages like a user would
        # Subset: clean page, two-column page, blank page, and the captured
        # fabrication (p21). The full 24-page corpus includes noise pages that
        # Tesseract chews on for minutes on CI runners; pytest already covers
        # the engine, this step proves the CLI end-to-end. p21's fabrication is
        # 21.7% of the subset's verified words, hence the loose gate.
        run: |
          uv run ocr-verify study/corpus/corpus.pdf study/marker_out/corpus/corpus.md \
            --pages 1,2,3,21 -o report.html --json report.json --fail-on 0.25
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: self-check-report
          path: report.html
