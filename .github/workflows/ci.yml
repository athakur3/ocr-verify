name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Tesseract (the witness)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: uv run pytest -q
      - name: Self-check — verify the study corpus like a user would
        run: |
          uv run ocr-verify study/corpus/corpus.pdf study/marker_out/corpus/corpus.md \
            -o report.html --json report.json --fail-on 0.10 --max-unverified 0.30
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: self-check-report
          path: report.html
