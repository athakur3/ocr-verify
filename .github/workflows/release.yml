name: Release

# Publishes to PyPI via trusted publishing (OIDC) — no token stored anywhere.
# Trigger: push a version tag (v0.2.0, ...). One-time setup on PyPI:
# project settings -> Publishing -> add GitHub publisher
# (owner: athakur3, repo: ocr-verify, workflow: release.yml, environment: pypi).

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run tests before anything ships
        run: |
          sudo apt-get update && sudo apt-get install -y tesseract-ocr
          uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC — this is what replaces the token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
